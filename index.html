<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Fader remote</title>
    <style>
      :root {
        --primary: #d87025;
        --ground: #eee;
        --card: #fff;
        --ink: #222;
        --muted: #777;
        --line: #ddd;
        --ok: #2e7d32;
        --bad: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #161616;
          --card: #222;
          --ink: #eee;
          --muted: #999;
          --line: #383838;
          --ok: #7bc67f;
          --bad: #ef8a8a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 30rem;
        margin: 0 auto;
      }
      h1 {
        margin: 4px 0 12px;
        font-size: 1.15rem;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 6px;
        background: var(--card);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .line {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .line > :first-child {
        flex: 1;
        min-width: 0;
      }
      button {
        min-height: 48px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: none;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      button.main {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      button.wide {
        width: 100%;
      }
      button small {
        display: block;
        font-weight: 400;
        font-size: 0.72rem;
        color: var(--muted);
      }
      button:active small,
      button.main small {
        color: inherit;
        opacity: 0.85;
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        min-height: 48px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: none;
        color: var(--ink);
        font: inherit;
      }
      label.field {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      label.field input {
        width: 5.5rem;
        flex: none;
      }
      .fader {
        display: grid;
        grid-template-columns: 3.2rem 1fr 2.8rem;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }
      .fader output {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--primary);
      }
      .hint {
        margin: 8px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      #log {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 0.82rem/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #log li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #log .ok {
        color: var(--ok);
      }
      #log .bad {
        color: var(--bad);
      }
      #log .wait {
        color: var(--muted);
      }
      .topic {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .topic button {
        min-height: 32px;
        padding: 2px 10px;
        font-size: 0.8rem;
        font-weight: 400;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fader remote</h1>

      <!-- First visit: no channel yet -->
      <section id="setup" class="card" hidden>
        <h2>Channel</h2>
        <form id="setup-form">
          <input id="topic-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="channel name" aria-label="Channel name" />
          <div class="line">
            <button type="button" id="generate">Make a random one</button>
            <button type="submit" class="main">Use it</button>
          </div>
        </form>
        <p class="hint">
          The channel name is the only secret: anyone who knows it can move the faders. Use a long
          random one, and give the same name to the app that talks to the device.
        </p>
      </section>

      <div id="controls" hidden>
        <section class="card">
          <h2>Mode</h2>
          <div class="grid">
            <button data-cmd="M0">Normal<small>M0</small></button>
            <button data-cmd="M1">Random, one<small>M1</small></button>
          </div>
          <div class="line">
            <button data-build="M2">Random, all<small>M2</small></button>
            <label class="field">every <input id="m2-sec" type="number" inputmode="numeric" min="1" max="3600" placeholder="5" /> s</label>
          </div>
          <div class="line">
            <button data-build="M3">Wave<small>M3</small></button>
            <label class="field">for <input id="m3-sec" type="number" inputmode="numeric" min="1" max="3600" placeholder="∞" /> s</label>
          </div>
        </section>

        <section class="card">
          <h2>Faders</h2>
          <button class="main wide" data-cmd="R">All to the middle<small>R</small></button>
          <div id="faders" style="margin-top: 12px"></div>
          <button class="wide" id="send-all" style="margin-top: 8px">Send all five<small>A</small></button>
          <p class="hint">Releasing a slider moves that fader.</p>
        </section>

        <section class="card">
          <h2>Settings</h2>
          <div class="grid">
            <button data-cmd="I1">Score detents on<small>I1</small></button>
            <button data-cmd="I0">Score detents off<small>I0</small></button>
          </div>
          <div class="line">
            <button data-build="T">Idle timeout<small>T</small></button>
            <label class="field"><input id="t-sec" type="number" inputmode="numeric" min="0" max="86400" placeholder="60" /> s, 0 = off</label>
          </div>
        </section>

        <section class="card">
          <h2>Any command</h2>
          <form id="raw-form" class="line">
            <input id="raw" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
              placeholder="G3,800" aria-label="Command" />
            <button type="submit">Send</button>
          </form>
        </section>

        <section class="card">
          <h2>Sent</h2>
          <ul id="log"><li class="wait"><span>nothing yet</span></li></ul>
        </section>

        <p class="topic">
          <span>channel <b id="topic-name"></b></span>
          <button id="forget">change</button>
        </p>
      </div>
    </main>

    <script>
      // Each button publishes one device command, as plain text, to an ntfy.sh topic.
      // The app that owns the serial port polls the same topic and forwards the lines.
      // The topic never appears in this file: it comes from the URL (#topic) or from
      // what was typed here before, and is remembered on this phone only.

      const NTFY = "https://ntfy.sh/";
      // Fader numbers as wired in the sketch.
      const FADERS = [
        [1, "score"],
        [2, "comm"],
        [3, "solv"],
        [4, "fits"],
        [5, "take"],
      ];
      // The device's whole command set; nothing else is ever published.
      const VALID = [
        /^G[1-5],(\d{1,3}|1000)$/,
        /^A(\d{1,3}|1000)(,(\d{1,3}|1000)){4}$/,
        /^R$/,
        /^T\d{1,5}$/,
        /^I[01]$/,
        /^M[0-3]$/,
        /^M[23],\d{1,4}$/,
        /^\?$/,
      ];
      const TOPIC_OK = /^[A-Za-z0-9_-]{8,64}$/;

      const $ = (id) => document.getElementById(id);

      function remembered() {
        try {
          return localStorage.getItem("topic") || "";
        } catch {
          return "";
        }
      }
      function remember(topic) {
        try {
          topic ? localStorage.setItem("topic", topic) : localStorage.removeItem("topic");
        } catch {}
      }

      let topic = "";

      function start() {
        const fromUrl = decodeURIComponent(location.hash.slice(1));
        topic = TOPIC_OK.test(fromUrl) ? fromUrl : remembered();
        if (!TOPIC_OK.test(topic)) topic = "";
        if (topic) remember(topic);
        $("setup").hidden = Boolean(topic);
        $("controls").hidden = !topic;
        $("topic-name").textContent = topic.slice(0, 4) + "…" + topic.slice(-2);
      }

      // --- sending ----------------------------------------------------------

      function logLine(cmd) {
        const log = $("log");
        if (log.firstElementChild?.classList.contains("wait") && !log.firstElementChild.dataset.cmd) {
          log.replaceChildren();
        }
        const li = document.createElement("li");
        li.className = "wait";
        li.dataset.cmd = cmd;
        const what = document.createElement("span");
        what.textContent = cmd;
        const state = document.createElement("span");
        state.textContent = "sending…";
        li.append(what, state);
        log.prepend(li);
        while (log.childElementCount > 8) log.lastElementChild.remove();
        return (ok, text) => {
          li.className = ok ? "ok" : "bad";
          state.textContent = text;
        };
      }

      async function send(cmd) {
        cmd = cmd.trim().toUpperCase();
        const done = logLine(cmd);
        if (!VALID.some((re) => re.test(cmd))) return done(false, "not a command");
        try {
          const res = await fetch(NTFY + encodeURIComponent(topic), {
            method: "POST",
            body: cmd,
            signal: AbortSignal.timeout(8000),
          });
          if (res.status === 429) return done(false, "too many, wait a bit");
          if (!res.ok) return done(false, "error " + res.status);
          done(true, new Date().toLocaleTimeString([], { hour12: false }));
        } catch {
          done(false, "no connection");
        }
      }

      // --- controls ---------------------------------------------------------

      const seconds = (id) => {
        const v = $(id).value.trim();
        return /^\d+$/.test(v) ? v : "";
      };

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.cmd) return send(button.dataset.cmd);
        switch (button.dataset.build) {
          case "M2": {
            const s = seconds("m2-sec");
            return send(s ? `M2,${s}` : "M2");
          }
          case "M3": {
            const s = seconds("m3-sec");
            return send(s ? `M3,${s}` : "M3");
          }
          case "T":
            return send("T" + (seconds("t-sec") || "60"));
        }
      });

      const sliders = FADERS.map(([n, name]) => {
        const row = document.createElement("label");
        row.className = "fader";
        const label = document.createElement("span");
        label.textContent = name;
        const range = document.createElement("input");
        range.type = "range";
        range.min = 0;
        range.max = 1000;
        range.step = 10;
        range.value = 500;
        const out = document.createElement("output");
        out.textContent = "500";
        range.addEventListener("input", () => (out.textContent = range.value));
        // "change" fires once, on release, so a drag is one command, not hundreds.
        range.addEventListener("change", () => send(`G${n},${range.value}`));
        row.append(label, range, out);
        $("faders").append(row);
        return range;
      });

      $("send-all").addEventListener("click", () => send("A" + sliders.map((s) => s.value).join(",")));

      $("raw-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if ($("raw").value.trim()) send($("raw").value);
        $("raw").value = "";
      });

      // --- channel ----------------------------------------------------------

      $("generate").addEventListener("click", () => {
        const bytes = crypto.getRandomValues(new Uint8Array(12));
        $("topic-input").value = "faders-" + Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      });

      $("setup-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = $("topic-input").value.trim();
        if (!TOPIC_OK.test(value)) {
          $("topic-input").value = "";
          $("topic-input").placeholder = "8–64 letters, digits, - or _";
          return;
        }
        remember(value);
        history.replaceState(null, "", "#" + value);
        start();
      });

      $("forget").addEventListener("click", () => {
        remember("");
        history.replaceState(null, "", location.pathname);
        start();
      });

      window.addEventListener("hashchange", start);
      start();
    </script>
  </body>
</html>
